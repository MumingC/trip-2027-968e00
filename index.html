<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>2027 暑假歐洲行</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky top bar with destination tabs; each hash route is a subpage with a lake-and-ridge hero band, then facts grid, highlights, cost table. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --fg:#17262d; --muted:#5b6c73; --line:#d6e0e3;
  --lake:#1f5f7a; --lake-soft:#dcebf1; --meadow:#4f7d4a; --sun:#d98e2b; --sun-soft:#f8ead6;
  --sky1:#bcd9e6; --sky2:#e9f2f4; --ridge1:#7d98a3; --ridge2:#4d6c78; --water:#2f7894;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1f; --surface:#16252c; --fg:#e4eef1; --muted:#9bb0b8; --line:#29404a;
  --lake:#6fb3cf; --lake-soft:#1b3440; --meadow:#8fc086; --sun:#f0b25c; --sun-soft:#3a2c18;
  --sky1:#1c3542; --sky2:#14262e; --ridge1:#36515c; --ridge2:#253e48; --water:#245c72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#16252c; --fg:#e4eef1; --muted:#9bb0b8; --line:#29404a;
  --lake:#6fb3cf; --lake-soft:#1b3440; --meadow:#8fc086; --sun:#f0b25c; --sun-soft:#3a2c18;
  --sky1:#1c3542; --sky2:#14262e; --ridge1:#36515c; --ridge2:#253e48; --water:#245c72; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:16px;align-items:center;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap;color:var(--lake);text-decoration:none}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:14px;padding:5px 11px;border-radius:999px;border:1px solid transparent}
nav a:hover{color:var(--fg);border-color:var(--line)}
nav a[aria-current="page"]{background:var(--lake);color:var(--surface);font-weight:700}
a:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.hero{position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
.hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:58%}
.hero .wrap{position:relative;padding-block:48px 72px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--lake);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,48px);line-height:1.2;margin:6px 0 10px;text-wrap:balance}
.lead{font-size:17px;max-width:38em;margin:0}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.tag.rec{background:var(--sun-soft);border-color:var(--sun);color:var(--fg);font-weight:700}
main{padding-block:28px 56px;display:flex;flex-direction:column;gap:36px}
h2{font-family:var(--display);font-size:22px;margin:0 0 12px;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.fact span{font-size:16px;font-weight:700}
.spots{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.spot{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.spot .ph{aspect-ratio:16/9;max-width:100%;background:linear-gradient(160deg,var(--lake-soft),var(--sky2));display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--display);font-size:18px;color:var(--lake);font-weight:800}
.spot .tx{padding:10px 14px 14px;min-width:0}
.spot .kid{font-size:13px;color:var(--meadow);font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
ul.ck{margin:0;padding-left:1.2em}
ul.ck li{margin:2px 0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
td.total{font-weight:700;color:var(--lake)}
tr.rec td:first-child{font-weight:700}
tr.rec td:first-child::after{content:" 推薦";font-size:12px;color:var(--sun)}
td a{color:var(--fg)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.photos{background:var(--sun-soft);border-radius:12px;padding:14px 16px}
.photos a{color:var(--lake);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card:hover{border-color:var(--lake)}
.card h3{margin:0;font-family:var(--display);font-size:18px}
.card p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.card .price{font-weight:700;color:var(--lake);font-size:14px;margin-top:8px}
.card.rec{border-color:var(--sun)}
footer{font-size:12px;color:var(--muted);padding-block:0 32px}
:root{--veil-1:rgba(243,246,247,.85);--veil-2:rgba(243,246,247,.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--veil-1:rgba(15,26,31,.85);--veil-2:rgba(15,26,31,.3)}}
:root[data-theme="dark"]{--veil-1:rgba(15,26,31,.85);--veil-2:rgba(15,26,31,.3)}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--veil-1) 72%,var(--veil-2))}
@media (max-width:1000px){.hero-photo::after{background:var(--veil-1)}}
.credit{font-family:var(--body);font-size:11px;font-weight:400;line-height:1.35;text-decoration:none;text-align:right}
.credit:hover{text-decoration:underline}
.hero .credit{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:8px;max-width:calc(100% - 20px);color:var(--fg);background:var(--veil-1);border-radius:4px;padding:1px 6px}
.spots{grid-template-columns:minmax(0,1fr);gap:28px}
.spot .gal{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:3px}
.spot .gal.solo{grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
.spot .ph.has{position:relative;overflow:hidden;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);aspect-ratio:auto;min-width:0;min-height:0;font-size:24px}
.spot .ph.lead{grid-row:1 / span 2;aspect-ratio:3/2}
.spot .gal.solo .ph.lead{grid-row:auto;aspect-ratio:2/1}
.spot .ph.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.spot .ph.has::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.45) 25%,rgba(0,0,0,0) 50%)}
.spot .ph.side::after{background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0) 34%)}
.spot .ph.has>span,.spot .ph.has .credit{position:relative;z-index:1}
.spot .ph.has .credit{align-self:flex-end;color:#fff}
.spot .ph.side{justify-content:flex-end;padding:6px 8px}
@media (max-width:640px){.spot .gal{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto}.spot .ph.lead{grid-column:1 / -1;grid-row:auto}.spot .ph.side{aspect-ratio:4/3}.spot .ph.has{font-size:20px}}
.spot .ph a.spotname{color:inherit;text-decoration:none;position:relative;z-index:1}
.spot .ph a.spotname:hover,.spot .ph a.spotname:focus-visible{text-decoration:underline;text-underline-offset:4px}
.spot .ph a.spotname small{font-size:.6em;opacity:.85;margin-left:.3em}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.mapgrid.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:720px){.mapgrid.two{grid-template-columns:minmax(0,1fr)}}
.mapfig{margin:0;min-width:0}
.mapfig figcaption{font-size:13px;color:var(--muted);margin-bottom:4px}
.map{background:var(--lake-soft);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:100%}
.map svg{display:block;width:100%;height:auto}
.m-land{fill:var(--surface);stroke:var(--muted);stroke-opacity:.45;stroke-width:.7;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.m-lake{fill:var(--lake-soft);stroke:var(--lake);stroke-opacity:.35;stroke-width:.6;vector-effect:non-scaling-stroke}
.m-leg{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round}
.m-leg.fly{stroke-dasharray:2 7}
.m-leg.thin{stroke-width:2}
.m-arrow{fill:var(--sun)}
.m-lead{stroke:var(--muted);stroke-width:1;fill:none}
.m-stop{fill:var(--lake);stroke:var(--surface);stroke-width:2}
.m-stop.hollow{fill:var(--surface);stroke:var(--lake);stroke-dasharray:3 2}
.m-stop.rec{fill:var(--sun)}
.m-num{fill:var(--surface);font-size:12px;font-weight:700;text-anchor:middle;font-family:var(--body)}
.m-num.hollow{fill:var(--lake)}
.m-end{fill:var(--surface);stroke:var(--lake);stroke-width:2.5}
.m-spot{fill:var(--meadow);stroke:var(--surface);stroke-width:1.5}
.m-lab{fill:var(--fg);font-family:var(--body);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.m-lab.spot{font-weight:500}
.map a:hover .m-lab{fill:var(--lake);text-decoration:underline}
.m-country{fill:var(--muted);font-family:var(--body);text-anchor:middle;letter-spacing:.08em}
.m-scale path{stroke:var(--fg);stroke-width:2;fill:none}
.m-scale text{fill:var(--fg);font-family:var(--body);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.m-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.m-legend span{display:inline-flex;align-items:center;gap:6px}
.k{display:inline-block;flex:none}
.k.stop,.k.dest{width:12px;height:12px;border-radius:50%;background:var(--lake)}
.k.dest.rec{background:var(--sun)}
.k.end{width:10px;height:10px;border-radius:2px;background:var(--surface);border:2px solid var(--lake)}
.k.spot{width:8px;height:8px;border-radius:50%;background:var(--meadow)}
.k.land{width:22px;border-top:3px solid var(--sun)}
.k.fly{width:22px;border-top:3px dotted var(--sun)}
.map.leaflet-container{background:var(--lake-soft);font:inherit;z-index:0}
.map.leaflet-container svg{width:auto;height:auto;max-width:none;display:inline}
.leaflet-tile-pane{filter:saturate(.75)}
.lm{display:grid;place-items:center;width:100%;height:100%;box-sizing:border-box;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.lm-stop{background:#2c6a85;border:2px solid #fff;color:#fff;font:700 12px/1 var(--body)}
.lm-stop.hollow{background:#fff;color:#2c6a85;border:2px dashed #2c6a85}
.lm-dest{background:#2c6a85;border:2px solid #fff;cursor:pointer}
.lm-dest.rec{background:#d9902f}
.lm-end{background:#fff;border:2px solid #2c6a85;border-radius:2px}
.lm-via{background:#fff;border:2px solid #2c6a85}
.lm-num{background:#4d7c4a;border:2px solid #fff;color:#fff;font:700 12px/1 var(--body);cursor:pointer}
.lm-home{background:#c2412d;border:2px solid #fff;border-radius:6px;color:#fff;font:700 12px/1 var(--body);z-index:1}
.lm-stay{background:#8a4f9e;border:2px solid #fff;border-radius:4px;color:#fff;font:700 11px/1 var(--body)}
.lm-spot{background:#4d7c4a;border:2px solid #fff}
.leaflet-tooltip.lm-lab{background:rgba(255,255,255,.92);border:0;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.25);padding:2px 6px;font:500 12px/1.3 var(--body);color:#1d2a30}
.leaflet-tooltip.lm-lab.big{font-weight:700;font-size:13px}
.leaflet-tooltip.lm-lab::before{display:none}
.lm-leg{stroke:#d9902f;fill:none;opacity:.9}
.lm-leg.fly{stroke-dasharray:2 7;stroke-linecap:round}
.lm-hint{position:absolute;left:8px;bottom:8px;z-index:500;font-size:11px;background:rgba(255,255,255,.85);color:#1d2a30;padding:2px 6px;border-radius:6px;pointer-events:none}
.leaflet-control-attribution{font-size:10px}
.deck{position:relative;--dw:min(78vw,calc(min(78vh,720px)*9/16))}
.deck-track{position:relative;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:calc(50% - var(--dw)/2);padding-block:2px;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab}
.deck-track::-webkit-scrollbar{display:none}
.deck-track.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.slide{flex:0 0 var(--dw);width:var(--dw);margin:0;min-width:0;scroll-snap-align:center;opacity:.5;transition:opacity .2s}
.slide.cur{opacity:1}
.slide:not(.cur) .play{display:none}
.frame{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:var(--lake-soft)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:inherit;display:block}
.poster img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(0,0,0,.6)}
.play::after{content:"";position:absolute;left:27px;top:20px;border-left:22px solid #fff;border-block:14px solid transparent}
.slide figcaption{font-size:16px;font-weight:700;margin-top:8px;text-align:center}
.slide small{display:block;font-size:13px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.deck-nav{position:absolute;top:calc(var(--dw)*8/9);width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:28px;line-height:1;cursor:pointer;z-index:1}
.deck-nav.prev{left:4px}
.deck-nav.next{right:4px}
.deck-nav:disabled{opacity:.3;cursor:default}
.deck-foot{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:8px}
.deck-dot{width:28px;height:28px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.deck-dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line)}
.deck-dot.on::before{background:var(--lake)}
.deck-count{font-size:13px;color:var(--muted);margin-left:6px}
.vidnote{font-size:13px;color:var(--muted);margin-bottom:10px}
.tbl table.wr td{white-space:normal;min-width:6em}
.tbl table.wr td:first-child{white-space:nowrap}
.verdict{background:var(--sun-soft);border-radius:12px;padding:14px 16px}
.verdict p{margin:0}
ol.tips{margin:0;padding-left:1.5em;display:grid;gap:10px}
ol.tips b{display:block}
ol.tips span{color:var(--muted);font-size:14px}
.plans{display:grid;gap:10px}
.plans details{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.plans summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:14px 16px;cursor:pointer;font-weight:700}
.plans .pn{font-family:var(--display);font-size:18px}
.plans .pc{color:var(--lake);font-size:14px}
.plans .pd{padding:0 16px 14px;min-width:0}
.plans h3{font-size:16px;margin:8px 0 4px}
.go{color:var(--lake);font-weight:700}
.mx{display:grid;gap:14px}
.mx-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mx-sum>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:2px;min-width:0}
.mx-sum span{color:var(--muted);font-size:13px}
.mx-sum b{font-family:var(--display);font-size:20px;color:var(--lake)}
.mx-warn{margin:0;padding:10px 14px 10px 32px;background:var(--sun-soft);border-radius:12px;display:grid;gap:4px;font-size:14px}
.mx-msg{margin:0;min-height:1.4em;font-size:14px;color:var(--lake)}
.mx-msg.bad{color:#b4462f}
.mx-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
@media (max-width:760px){.mx-grid{grid-template-columns:minmax(0,1fr)}}
.mx-days{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mx-day{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;align-items:stretch}
.mx-d{display:grid;align-content:center;gap:1px;font-size:14px}
.mx-d span{color:var(--muted);font-size:12px}
.mx-day.de .mx-d span{color:var(--meadow)}
.mx-day.ch .mx-d span{color:var(--lake)}
.mx-day.jf .mx-d span{color:var(--sun)}
.mx-card.jf{border-left-color:#7a6bb0}
.mx-fix{padding:10px 12px;color:var(--muted);font-size:14px;border-left:3px solid var(--line)}
.mx-slot{min-height:64px;border-radius:12px;display:flex;min-width:0;transition:background .12s,outline-color .12s;outline:2px dashed transparent;outline-offset:-2px}
.mx-slot>.mx-card{flex:1}
.mx-slot.empty,.mx-slot.cont{align-items:center;padding:10px 12px;font-size:14px;color:var(--muted);outline-color:var(--line);cursor:pointer}
.mx-slot.cont{background:var(--lake-soft);color:var(--fg);outline-style:solid}
.mx-slot.ok{outline-color:var(--lake);background:var(--lake-soft)}
.mx-slot.bad{outline-color:#b4462f;background:rgba(180,70,47,.12)}
.mx-pool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;transition:outline-color .12s;outline:2px dashed transparent;outline-offset:-4px}
@media (max-width:760px){.mx-pool{position:static;max-height:none}}
.mx-pool.ok{outline-color:var(--lake)}
.mx-pool h2{margin:0 0 4px;font-size:18px}
.mx-pool h3{margin:14px 0 6px;font-size:14px;color:var(--muted)}
.mx-list{display:grid;gap:8px}
.mx-none{margin:0;color:var(--muted);font-size:13px}
.mx-card{position:relative;display:grid;gap:2px;padding:9px 34px 9px 12px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--meadow);border-radius:10px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;min-width:0;color:var(--fg);font-size:14px}
.mx-card[data-id] b{font-size:15px}
.mx-card.ch{border-left-color:var(--lake)}
.mx-card.far{border-left-color:var(--sun)}
.mx-card.sel{outline:2px solid var(--lake);outline-offset:1px}
.mx-card:focus-visible{outline:2px solid var(--lake);outline-offset:1px}
.mx-meta{color:var(--lake);font-size:13px}
.mx-tip{color:var(--muted);font-size:12.5px}
.mx-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.mx-x:hover{background:var(--line);color:var(--fg)}
.mx-dragging{opacity:.35}
.mx-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.25);cursor:grabbing;opacity:.95}
.mx-foot{margin:0}
.mx-reset{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.spot .gal.duo{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}
.spot .gal.duo .ph.lead,.spot .gal.duo .ph.side{grid-row:auto;grid-column:auto;aspect-ratio:4/3}
.snowtbl{margin-top:20px}
@media (max-width:640px){.spot .gal.duo{grid-template-columns:minmax(0,1fr)}.spot .gal.duo .ph.lead,.spot .gal.duo .ph.side{aspect-ratio:3/2}}
.sg-h{margin:18px 0 8px;font-size:16px;color:var(--muted)}
.sights{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sg{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;display:grid;grid-template-rows:auto 1fr}
.sg-ph{position:relative;aspect-ratio:3/2;overflow:hidden}
.sg-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.sg-ph .credit{position:absolute;right:6px;bottom:4px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);font-size:10px}
.sg figcaption{display:grid;gap:3px;padding:10px 12px 12px}
.sg figcaption a{font-weight:700;font-size:15px;color:var(--fg);text-decoration:none}
.sg figcaption a:hover{color:var(--lake);text-decoration:underline}
.sg-day{font-size:12px;color:var(--lake);font-weight:700}
.sg-tx{font-size:13.5px;color:var(--muted)}

/* 住宿頁 */
.st-area{font-size:16px;margin:18px 0 6px;color:var(--muted)}
.st-link{color:var(--lake);font-weight:700;text-decoration:none}
.st-link small{font-size:11px;margin-left:2px}
.st-p{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st-p.st-B{color:var(--lake)}
.st-p.st-A{color:var(--sun)}
table.st td:nth-child(6),table.st td:nth-child(7){white-space:nowrap;text-align:right}
@media (max-width:700px){
  .tbl table.st{min-width:0;width:100%}
  table.st thead{display:none}
  table.st tbody{display:block}
  table.st tr{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.st td{display:block;padding:0;border:0;min-width:0;text-align:left;white-space:normal}
  table.st td:nth-child(1){grid-column:1;grid-row:1}
  table.st td:nth-child(6){grid-column:2;grid-row:1;text-align:right;font-size:17px}
  table.st td:nth-child(3){grid-column:1;grid-row:2;color:var(--muted);font-size:14px}
  table.st td:nth-child(7){grid-column:2;grid-row:2;text-align:right;color:var(--muted);font-size:13px}
  table.st td:nth-child(7)::before{content:"一晚 "}
  table.st td:nth-child(4){grid-column:1;grid-row:3;font-size:14px}
  table.st td:nth-child(2){grid-column:2;grid-row:3;text-align:right}
  table.st td:nth-child(5){grid-column:1;grid-row:4;font-size:13px;color:var(--muted)}
  table.st td:nth-child(5)::before{content:"評分 "}
}

/* 分站頁 */
.sg-n{position:absolute;left:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#4d7c4a;color:#fff;border:2px solid #fff;display:grid;place-items:center;font:700 13px/1 var(--body);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sg-dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:6px 0 0;font-size:13px}
.sg-dl dt{color:var(--muted);font-weight:700}
.sg-dl dd{margin:0;min-width:0}
.seg-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cards.seg3 .card h3{color:var(--lake)}
.m-legend .k.sgnum{background:#4d7c4a;border-radius:50%}
.m-legend .k.sgstay{background:#8a4f9e;border-radius:3px}

.seg-keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin-top:10px}
@media (max-width:640px){.seg-keys{grid-template-columns:1fr}}
.seg-key{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px;min-width:0}
.seg-key li{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:3px 0}
.seg-key a{color:var(--fg);text-decoration:none}
.seg-key a:hover{color:var(--lake)}
.seg-key li>span:last-child{color:var(--muted);white-space:nowrap}
.seg-key .k{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:6px;color:#fff;font:700 11px/1 var(--body);font-style:normal;vertical-align:-4px}
.seg-key .k.sgnum{background:#4d7c4a;border-radius:50%}
.seg-key .k.sgstay{background:#8a4f9e;border-radius:4px}

.seg-key li>a,.seg-key li>span:first-child{display:inline-flex;align-items:center;min-width:0}
.seg-key .k{vertical-align:0;flex:none}

.seg-key .sis-d{margin-left:6px;color:var(--muted);font-size:12px;white-space:nowrap}
.mapfig.near{margin-top:14px}
.mapfig.near .map{height:300px}
</style>
</head>

}

  document.getElementById("hero").innerHTML=(photo?'<div class="hero-photo" style="background-image:url('+photo.src+')"></div>':ridge("alp"))+'<div class="wrap"><div class="eyebrow">'+eyebrow+'</div><h1>'+h1+'</h1><p class="lead">'+lead+'</p><div class="tagrow">'+tags.map((t,i)=>'<span class="tag'+(i===0?' rec':'')+'">'+t+'</span>').join("")+'</div></div>'+(photo?creditHTML(photo):'');
};

function navHTML(cur){
  const on=OTHERS.includes(cur)?"more":(NAVMAP[cur]||cur);
  return NAV.map(([k,t])=>'<a href="#'+k+'"'+(on===k?' aria-current="page"':'')+'>'+t+'</a>').join("");
}
